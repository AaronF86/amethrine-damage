when:
  - event: [ "push" ]
    tag: [ "v*" ]

engine: "nixery"

dependencies:
  nixpkgs:
    - jdk25
    - bash
    - coreutils
    - curl
    - findutils
    - gnugrep
    - gnused
    - git

environment:
  GRADLE_USER_HOME: ".gradle-home"
  JAVA_HOME: "/lib/openjdk"
  # The runner has far less memory than a dev machine
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2"
  MINECRAFT_EULA: "true"
  ORG_GRADLE_PROJECT_gametest_jobs: "1"

cache:
  - key: "gradle-publish"
    hash:
      - "gradle/wrapper/gradle-wrapper.properties"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "versions/26.1.properties"
      - "versions/26.1.1.properties"
      - "versions/26.1.2.properties"
      - "versions/26.2.properties"
      - "versions/26.3.properties"
    paths: [ ".gradle-home/caches", ".gradle-home/wrapper", ".gradle/loom-cache", ".cache/gametest" ]

steps:
  - name: "Check the Gradle wrapper"
    command: |
      version=$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
      curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256" | sed 's/$/  gradle\/wrapper\/gradle-wrapper.jar/' | sha256sum -c -
  - name: "Release"
    command: "./gradlew release -Pstrict"
